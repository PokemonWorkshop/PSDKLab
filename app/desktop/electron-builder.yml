appId: org.pokemonworkshop.psdk-lab
productName: PSDK Lab
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - resources/icon.png
# runtimes/dist holds Git and 7za for the OS that ran prepare:runtimes,
# so each installer is built on its own platform.
extraResources:
  - from: ../../runtimes/dist
    to: runtimes
win:
  target: nsis
  icon: resources/icon-256.png # electron-builder needs at least 256x256
linux:
  target: AppImage
  icon: resources/icon-256.png
